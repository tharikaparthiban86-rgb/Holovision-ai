<!-- ================= PART 8 : FINAL UI CONTROL ================= -->

<script>
/* =========================================
   BLOOD FLOW CONTROL
   ========================================= */

const bloodFlow = document.getElementById("bloodFlow");
const bloodFlowValue = document.getElementById("bloodFlowValue");

if (bloodFlow && bloodFlowValue) {

    bloodFlow.addEventListener("input", function () {

        bloodFlowValue.textContent =
            Number(this.value).toFixed(1) + "×";

    });

}


/* =========================================
   CHALLENGE
   ========================================= */

const answerButtons =
    document.querySelectorAll(".answer-btn");

answerButtons.forEach(function(button) {

    button.addEventListener("click", function() {

        if (this.dataset.correct === "true") {

            this.textContent = "✓ Correct!";

        } else {

            this.textContent = "Try Again";

        }

    });

});


/* =========================================
   MORE TOPICS
   ========================================= */

const moreTopics =
    document.getElementById("moreTopics");

if (moreTopics) {

    moreTopics.addEventListener("click", function() {

        const panel =
            document.querySelector(".topics-panel");

        if (panel) {

            panel.scrollTo({
                top: panel.scrollHeight,
                behavior: "smooth"
            });

        }

    });

}
</script>

<!-- ================= END PART 8 ================= -->

</body>
</html>
