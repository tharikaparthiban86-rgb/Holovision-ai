<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020611">

    <title>HoloVision AI - Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(0, 220, 255, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 70%,
                    rgba(150, 60, 255, 0.10),
                    transparent 35%
                ),
                #020611;

            overflow-x: hidden;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            padding-bottom: 40px;
        }


        .page::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 12% 25%,
                    #00eaff 0,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 86% 20%,
                    #9b5cff 0,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 72% 75%,
                    #00eaff 0,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 25% 82%,
                    #b44dff 0,
                    transparent 2px
                );

            opacity: 0.45;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;
            min-height: 82px;

            padding: 12px 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: relative;
            z-index: 20;

            border-bottom: 1px solid rgba(0, 220, 255, 0.20);

            background: rgba(2, 8, 22, 0.82);

            backdrop-filter: blur(12px);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 13px;
        }


        .logo-icon {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #00eaff;

            background: rgba(0, 220, 255, 0.05);

            box-shadow:
                0 0 12px rgba(0, 220, 255, 0.3);
        }


        .logo-icon span {
            font-family: 'Orbitron', sans-serif;

            font-size: 25px;
            font-weight: 800;

            color: #00eaff;

            text-shadow:
                0 0 8px #00eaff,
                0 0 18px rgba(180, 70, 255, 0.6);
        }


        .brand-title {
            font-family: 'Orbitron', sans-serif;

            font-size: 20px;
            font-weight: 700;

            letter-spacing: 2px;
        }


        .brand-subtitle {
            margin-top: 4px;

            font-size: 8px;

            letter-spacing: 2.5px;

            color: #00dfff;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .home-btn {
            padding: 10px 18px;

            border: 1px solid #00dfff;
            border-radius: 11px;

            background: rgba(0, 30, 55, 0.65);

            color: #ffffff;

            font-family: 'Poppins', sans-serif;

            font-weight: 600;
            font-size: 13px;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 0 12px rgba(0, 220, 255, 0.15);
        }


        .home-btn:hover {
            transform: translateY(-2px);

            border-color: #b44dff;

            color: #00eaff;

            box-shadow:
                0 0 20px rgba(0, 220, 255, 0.4);
        }


        /* =========================
           HOLOGRAM
        ========================= */

        .hologram-area {
            width: 100%;
            height: 190px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .holo-ring {
            position: absolute;

            width: 250px;
            height: 80px;

            border: 1px solid rgba(0, 234, 255, 0.55);

            border-radius: 50%;

            transform: rotateX(65deg);

            box-shadow:
                0 0 12px rgba(0, 220, 255, 0.2);

            animation: ringRotate 7s linear infinite;
        }


        .holo-ring.two {
            width: 190px;
            height: 60px;

            border-color:
                rgba(180, 70, 255, 0.55);

            animation-duration: 10s;

            animation-direction: reverse;
        }


        @keyframes ringRotate {

            from {
                transform:
                    rotateX(65deg)
                    rotateZ(0deg);
            }

            to {
                transform:
                    rotateX(65deg)
                    rotateZ(360deg);
            }
        }


        /* =========================
           HV CORE
        ========================= */

        .hv-core {
            width: 88px;
            height: 88px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 5;

            border: 1px solid rgba(0, 234, 255, 0.7);

            transform: rotate(45deg);

            background: rgba(0, 30, 60, 0.15);

            box-shadow:
                0 0 18px rgba(0, 220, 255, 0.25);

            animation: corePulse 3s ease-in-out infinite;
        }


        .hv-core span {
            transform: rotate(-45deg);

            font-family: 'Orbitron', sans-serif;

            font-size: 29px;
            font-weight: 800;

            color: #00eaff;

            text-shadow:
                0 0 7px #00eaff,
                0 0 18px rgba(180, 70, 255, 0.5);
        }


        @keyframes corePulse {

            50% {
                box-shadow:
                    0 0 30px rgba(0, 220, 255, 0.5),
                    0 0 45px rgba(160, 60, 255, 0.2);
            }
        }


        /* =========================
           TITLE
        ========================= */

        .chat-heading {
            position: relative;
            z-index: 10;

            text-align: center;

            padding: 0 20px;
        }


        .chat-heading h1 {
            font-family: 'Orbitron', sans-serif;

            font-size: clamp(25px, 4vw, 36px);

            letter-spacing: 3px;

            background:
                linear-gradient(
                    90deg,
                    #00eaff,
                    #ffffff,
                    #b44dff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .chat-heading p {
            margin-top: 8px;

            color: #b9dff0;

            font-size: 14px;
        }


        /* =========================
           CHAT CONTAINER
        ========================= */

        .chat-wrapper {
            width: min(900px, 92%);

            margin: 25px auto 0;

            position: relative;
            z-index: 10;

            padding: 22px;

            border: 1px solid rgba(0, 220, 255, 0.25);

            border-radius: 22px;

            background:
                rgba(3, 15, 32, 0.82);

            backdrop-filter: blur(15px);

            box-shadow:
                0 0 30px rgba(0, 220, 255, 0.08),
                inset 0 0 25px rgba(0, 220, 255, 0.025);
        }


        /* =========================
           ANSWER
        ========================= */

        #answer {
            width: 100%;

            min-height: 150px;
            max-height: 350px;

            overflow-y: auto;

            padding: 18px;

            margin-bottom: 15px;

            border-radius: 15px;

            border: 1px solid rgba(0, 220, 255, 0.15);

            background: rgba(0, 0, 0, 0.25);

            color: #dffaff;

            line-height: 1.7;

            font-size: 14px;
        }


        /* =========================
           INPUT
        ========================= */

        .input-area {
            width: 100%;

            display: flex;

            gap: 10px;

            align-items: stretch;
        }


        #question {
            flex: 1;

            min-height: 55px;

            max-height: 150px;

            resize: vertical;

            padding: 15px;

            border: 1px solid rgba(0, 220, 255, 0.3);

            border-radius: 14px;

            outline: none;

            background: rgba(0, 25, 45, 0.8);

            color: #ffffff;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;
        }


        #question::placeholder {
            color: #7895a8;
        }


        #question:focus {
            border-color: #00eaff;

            box-shadow:
                0 0 15px rgba(0, 220, 255, 0.2);
        }


        #sendBtn {
            min-width: 105px;

            height: 55px;

            border: 1px solid #00eaff;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 220, 255, 0.15),
                    rgba(120, 50, 255, 0.2)
                );

            color: #ffffff;

            font-family: 'Orbitron', sans-serif;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        #sendBtn:hover {
            transform: translateY(-2px);

            border-color: #b44dff;

            box-shadow:
                0 0 25px rgba(0, 220, 255, 0.5);
        }


        /* =========================
           TOOLS
        ========================= */

        .tool-buttons {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 15px;
        }


        .tool-btn {
            min-height: 48px;

            padding: 10px;

            border: 1px solid rgba(0, 220, 255, 0.3);

            border-radius: 12px;

            background:
                rgba(0, 25, 45, 0.7);

            color: #dffaff;

            font-family: 'Poppins', sans-serif;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        .tool-btn:hover {
            transform: translateY(-2px);

            border-color: #00eaff;

            color: #ffffff;

            background:
                rgba(0, 220, 255, 0.08);

            box-shadow:
                0 0 16px rgba(0, 220, 255, 0.25);
        }


        /* =========================
           MESSAGES
        ========================= */

        .user-message {
            margin: 10px 0;

            margin-left: auto;

            padding: 12px 15px;

            max-width: 85%;

            border-radius:
                16px 16px 3px 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 180, 220, 0.18),
                    rgba(80, 50, 180, 0.18)
                );

            border: 1px solid rgba(0, 220, 255, 0.2);

            color: #ffffff;
        }


        .ai-message {
            margin: 10px 0;

            margin-right: auto;

            padding: 12px 15px;

            max-width: 85%;

            border-radius:
                16px 16px 16px 3px;

            background:
                rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(180, 70, 255, 0.2);

            color: #dffaff;
        }


        /* =========================
           IMAGE PREVIEW
        ========================= */

        #imagePreview {
            margin-top: 15px;

            text-align: center;
        }


        #imagePreview img {
            max-width: 100%;

            max-height: 220px;

            border-radius: 14px;

            border: 1px solid #00eaff;

            box-shadow:
                0 0 20px rgba(0, 220, 255, 0.25);
        }


        /* =========================
           3D AREA
        ========================= */

        #visual3dArea {
            width: 100%;
            min-height: 0;

            margin-top: 15px;

            border-radius: 16px;

            overflow: hidden;
        }


        /* =========================
           FOOTER
        ========================= */

        .chat-footer {
            text-align: center;

            margin-top: 20px;

            color: #547286;

            font-size: 9px;

            letter-spacing: 2px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .header {
                padding: 12px 20px;
            }

            .chat-wrapper {
                width: 94%;
            }

            .tool-buttons {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        /* =========================
           PHONE
        ========================= */

        @media (max-width: 600px) {

            .header {
                min-height: 72px;

                padding: 9px 12px;
            }


            .logo {
                gap: 8px;
            }


            .logo-icon {
                width: 44px;
                height: 44px;
            }


            .logo-icon span {
                font-size: 20px;
            }


            .brand-title {
                font-size: 13px;

                letter-spacing: 1px;
            }


            .brand-subtitle {
                font-size: 6px;

                letter-spacing: 1.3px;
            }


            .home-btn {
                padding: 8px 11px;

                font-size: 10px;
            }


            .hologram-area {
                height: 155px;
            }


            .holo-ring {
                width: 205px;
                height: 67px;
            }


            .holo-ring.two {
                width: 155px;
                height: 50px;
            }


            .hv-core {
                width: 70px;
                height: 70px;
            }


            .hv-core span {
                font-size: 23px;
            }


            .chat-heading {
                margin-top: 0;
            }


            .chat-heading h1 {
                font-size: 23px;

                letter-spacing: 1.5px;
            }


            .chat-heading p {
                font-size: 11px;
            }


            .chat-wrapper {
                width: 94%;

                padding: 14px;

                margin-top: 18px;

                border-radius: 18px;
            }


            #answer {
                min-height: 125px;

                max-height: 300px;

                padding: 14px;

                font-size: 12px;
            }


            .input-area {
                flex-direction: column;

                gap: 9px;
            }


            #question {
                width: 100%;

                min-height: 90px;

                font-size: 13px;
            }


            #sendBtn {
                width: 100%;

                height: 50px;
            }


            .tool-buttons {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 8px;
            }


            .tool-btn {
                min-height: 44px;

                padding: 7px 4px;

                font-size: 10px;
            }


            .user-message,
            .ai-message {
                max-width: 92%;

                font-size: 12px;
            }
        }


        /* =========================
           VERY SMALL PHONE
        ========================= */

        @media (max-width: 380px) {

            .brand-title {
                font-size: 11px;
            }


            .brand-subtitle {
                font-size: 5px;
            }


            .home-btn {
                padding: 7px 9px;
            }


            .hologram-area {
                height: 140px;
            }


            .holo-ring {
                width: 180px;
                height: 60px;
            }


            .holo-ring.two {
                width: 135px;
                height: 45px;
            }


            .hv-core {
                width: 62px;
                height: 62px;
            }


            .hv-core span {
                font-size: 20px;
            }


            .chat-heading h1 {
                font-size: 20px;
            }


            .tool-btn {
                font-size: 9px;
            }
        }

    </style>
</head>


<body>

<div class="page">


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                <span>HV</span>
            </div>

            <div>

                <div class="brand-title">
                    HOLOVISION AI
                </div>

                <div class="brand-subtitle">
                    INTELLIGENT LEARNING SYSTEM
                </div>

            </div>

        </div>


        <button
            class="home-btn"
            type="button"
            onclick="window.location.href='index.html'">

            ← Home

        </button>

    </header>


    <!-- =========================
         HOLOGRAM
    ========================= -->

    <section class="hologram-area">

        <div class="holo-ring"></div>

        <div class="holo-ring two"></div>

        <div class="hv-core">
            <span>HV</span>
        </div>

    </section>


    <!-- =========================
         TITLE
    ========================= -->

    <section class="chat-heading">

        <h1>
            HOLOVISION AI
        </h1>

        <p>
            Your Intelligent Learning Assistant
        </p>

    </section>


    <!-- =========================
         CHAT
    ========================= -->

    <div class="chat-wrapper">


        <!-- ANSWER -->

        <div id="answer">

            <div class="ai-message">

                👋 Hello! I'm your HoloVision AI
                learning assistant.

                <br><br>

                Ask me anything about your studies!

            </div>

        </div>

        <!-- INPUT -->

        <div class="input-area">

            <textarea
                id="question"
                placeholder="Ask anything about your studies..."></textarea>

            <button
                id="sendBtn"
                type="button">

                Send ✦

            </button>

        </div>


        <!-- =========================
             TOOL BUTTONS
        ========================= -->

        <div class="tool-buttons">

            <button
                id="voiceBtn"
                class="tool-btn"
                type="button">

                🎤 Speak

            </button>


            <button
                id="speakBtn"
                class="tool-btn"
                type="button">

                🔊 Read Answer

            </button>


            <button
                id="studyBtn"
                class="tool-btn"
                type="button">

                🎓 Study Mode

            </button>


            <button
                id="visual3dBtn"
                class="tool-btn"
                type="button">

                🌐 3D Visualisation

            </button>


            <button
                id="clearBtn"
                class="tool-btn"
                type="button">

                🗑️ Clear Chat

            </button>


            <button
                id="cameraBtn"
                class="tool-btn"
                type="button">

                📷 Camera

            </button>


            <button
                id="uploadBtn"
                class="tool-btn"
                type="button">

                🖼️ Upload Image

            </button>

        </div>


        <!-- =========================
             IMAGE INPUT
        ========================= -->

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            capture="environment"
            style="display:none;">


        <div id="imagePreview"></div>


        <!-- =========================
             3D VISUALISATION
        ========================= -->

        <div id="visual3dArea"></div>


        <!-- =========================
             FOOTER
        ========================= -->

        <div class="chat-footer">

            HOLOVISION AI • INTELLIGENT LEARNING SYSTEM

        </div>

    </div>


</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>


<!-- ORBIT CONTROLS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<!-- GLTF LOADER -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


<!-- REAL 3D -->

<script src="real3d.js"></script>


<!-- AI CHAT -->

<script type="module" src="chat.js"></script>


</body>

</html>
