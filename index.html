<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07152f">

    <title>HoloVision AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #030817;
            color: white;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
        }

        /* MAIN SCREEN */

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(0, 170, 255, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #07152f,
                    #031b38
                );
            position: relative;
            overflow: hidden;
        }

        /* BACKGROUND GLOW */

        .page::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(0, 174, 255, 0.08);
            filter: blur(80px);
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* CONTENT */

        .main-content {
            width: 100%;
            max-width: 1100px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* LOGO */

        .logo {
            font-size: clamp(30px, 5vw, 52px);
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow:
                0 0 10px #00bfff,
                0 0 25px rgba(0, 191, 255, 0.7);
        }

        .logo span {
            color: #00c8ff;
        }

        .tagline {
            font-size: clamp(13px, 2vw, 18px);
            color: #9fc9df;
            margin-bottom: 45px;
            letter-spacing: 1px;
        }

        /* HOLOGRAM AREA */

        .hologram-area {
            width: min(80vw, 420px);
            height: 330px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        /* CUBE */

        .cube {
            width: 145px;
            height: 145px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-18deg) rotateY(35deg);
            animation: rotateCube 9s linear infinite;
        }

        .face {
            position: absolute;
            width: 145px;
            height: 145px;
            border: 2px solid #00c8ff;
            background: rgba(0, 174, 255, 0.06);
            box-shadow:
                inset 0 0 25px rgba(0, 200, 255, 0.18),
                0 0 18px rgba(0, 200, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .front {
            transform: translateZ(72.5px);
        }

        .back {
            transform: rotateY(180deg) translateZ(72.5px);
        }

        .right {
            transform: rotateY(90deg) translateZ(72.5px);
        }

        .left {
            transform: rotateY(-90deg) translateZ(72.5px);
        }

        .top {
            transform: rotateX(90deg) translateZ(72.5px);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(72.5px);
        }

        .hv {
            font-size: 38px;
            font-weight: bold;
            color: #00d9ff;
            text-shadow:
                0 0 10px #00d9ff,
                0 0 25px #008cff;
        }

        @keyframes rotateCube {
            from {
                transform: rotateX(-18deg) rotateY(0deg);
            }

            to {
                transform: rotateX(-18deg) rotateY(360deg);
            }
        }

        /* HOLOGRAM BEAM */

        .beam {
            position: absolute;
            bottom: 50px;
            width: 210px;
            height: 75px;
            background: linear-gradient(
                to top,
                rgba(0, 204, 255, 0.32),
                rgba(0, 204, 255, 0.03)
            );
            clip-path: polygon(
                28% 100%,
                72% 100%,
                100% 0,
                0 0
            );
            filter: blur(1px);
            animation: beamPulse 2s ease-in-out infinite;
        }

        @keyframes beamPulse {
            0%,
            100% {
                opacity: 0.65;
            }

            50% {
                opacity: 1;
            }
        }

        /* PROJECTOR */

        .projector {
            position: absolute;
            bottom: 20px;
            width: 190px;
            height: 30px;
            border-radius: 50%;
            background: #06182d;
            border: 2px solid #00bfff;
            box-shadow:
                0 0 15px #00bfff,
                0 0 35px rgba(0, 191, 255, 0.5);
        }

        .projector::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 10px;
            border-radius: 50%;
            background: #00d9ff;
            box-shadow: 0 0 20px #00d9ff;
        }

        /* WELCOME */

        .welcome {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome h1 {
            font-size: clamp(34px, 6vw, 62px);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .welcome p {
            color: #a8c6d8;
            font-size: clamp(15px, 2.5vw, 20px);
            margin-bottom: 28px;
        }

        /* ENTER BUTTON */

        .enter-btn {
            border: 1px solid #00c8ff;
            background: linear-gradient(
                135deg,
                #008dcc,
                #005b9f
            );
            color: white;
            padding: 16px 30px;
            border-radius: 12px;
            min-width: 220px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            box-shadow:
                0 0 15px rgba(0, 191, 255, 0.45);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 0 25px rgba(0, 200, 255, 0.7);
        }

        .enter-btn:active {
            transform: scale(0.97);
        }

        .arrow {
            font-size: 23px;
        }

        /* LAPTOP */

        @media (min-width: 768px) {

            .main-content {
                min-height: 90vh;
            }

            .hologram-area {
                height: 350px;
            }

            .cube,
            .face {
                width: 160px;
                height: 160px;
            }

            .front {
                transform: translateZ(80px);
            }

            .back {
                transform: rotateY(180deg) translateZ(80px);
            }

            .right {
                transform: rotateY(90deg) translateZ(80px);
            }

            .left {
                transform: rotateY(-90deg) translateZ(80px);
            }

            .top {
                transform: rotateX(90deg) translateZ(80px);
            }

            .bottom {
                transform: rotateX(-90deg) translateZ(80px);
            }
        }

        /* PHONE */

        @media (max-width: 600px) {

            .page {
                padding: 25px 15px;
            }

            .main-content {
                min-height: 100vh;
            }

            .logo {
                margin-top: 5px;
            }

            .tagline {
                margin-bottom: 20px;
            }

            .hologram-area {
                height: 280px;
                width: 100%;
                margin-bottom: 10px;
            }

            .cube,
            .face {
                width: 115px;
                height: 115px;
            }

            .front {
                transform: translateZ(57.5px);
            }

            .back {
                transform: rotateY(180deg) translateZ(57.5px);
            }

            .right {
                transform: rotateY(90deg) translateZ(57.5px);
            }

            .left {
                transform: rotateY(-90deg) translateZ(57.5px);
            }

            .top {
                transform: rotateX(90deg) translateZ(57.5px);
            }

            .bottom {
                transform: rotateX(-90deg) translateZ(57.5px);
            }

            .hv {
                font-size: 30px;
            }

            .beam {
                width: 165px;
                bottom: 42px;
            }

            .projector {
                width: 150px;
                bottom: 17px;
            }

            .welcome h1 {
                font-size: 36px;
            }

            .welcome p {
                font-size: 15px;
                padding: 0 10px;
                margin-bottom: 22px;
            }

            .enter-btn {
                width: min(90%, 280px);
                padding: 15px 22px;
                font-size: 14px;
            }
        }

        /* SMALL PHONES */

        @media (max-width: 380px) {

            .hologram-area {
                height: 245px;
            }

            .cube,
            .face {
                width: 95px;
                height: 95px;
            }

            .front {
                transform: translateZ(47.5px);
            }

            .back {
                transform: rotateY(180deg) translateZ(47.5px);
            }

            .right {
                transform: rotateY(90deg) translateZ(47.5px);
            }

            .left {
                transform: rotateY(-90deg) translateZ(47.5px);
            }

            .top {
                transform: rotateX(90deg) translateZ(47.5px);
            }

            .bottom {
                transform: rotateX(-90deg) translateZ(47.5px);
            }

            .hv {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <main class="main-content">

        <!-- LOGO -->

        <div class="logo">
            HOLO<span>VISION</span> AI
        </div>

        <div class="tagline">
            Smart • Interactive • Visual Learning
        </div>


        <!-- HOLOGRAM -->

        <div class="hologram-area">

            <div class="cube">

                <div class="face front">
                    <span class="hv">HV</span>
                </div>

                <div class="face back">
                    <span class="hv">HV</span>
                </div>

                <div class="face right">
                    <span class="hv">HV</span>
                </div>

                <div class="face left">
                    <span class="hv">HV</span>
                </div>

                <div class="face top">
                    <span class="hv">HV</span>
                </div>

                <div class="face bottom">
                    <span class="hv">HV</span>
                </div>

            </div>

            <div class="beam"></div>

            <div class="projector"></div>

        </div>


        <!-- WELCOME -->

        <section class="welcome">

            <h1>
                Welcome!
            </h1>

            <p>
                Your Intelligent Learning Assistant
            </p>

            <button
                type="button"
                class="enter-btn"
                onclick="enterAILab()">

                <span>
                    ENTER AI LAB
                </span>

                <span class="arrow">
                    →
                </span>

            </button>

        </section>

    </main>

</div>


<!-- AI LAB NAVIGATION -->

<script>
    function enterAILab() {
        window.location.href = "ai-chat.html";
    }
</script>

</body>
</html>
